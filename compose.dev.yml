services:
  db:
    image: mariadb:11.8
    container_name: evolutionwalker-dev-db

    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app

    ports:
      - "3306:3306"

    volumes:
      - mariadb_dev_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_dev_data: